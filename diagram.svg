<svg width="760" height="1720" viewBox="0 0 380 860" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Cylindrical detachable housing mounted below the cane's rubber grip</title>
<desc>Diagram showing the rubber grip at the top of the cane preserved intact, with the permanent collar base mounted on the rigid shaft just below the grip, a removable cylindrical pod with the Arduino and battery that twists onto that collar, and a matching charging dock stand for when the pod is detached.</desc>

<rect x="0" y="0" width="380" height="860" fill="#FFFFFF"/>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5A5F6B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<style>
.th { font-size: 15px; font-weight: bold; fill: #1B2A4A; }
.ts { font-size: 12px; fill: #5A5F6B; }
.lbl { font-size: 12px; fill: #5A5F6B; }
.teal { fill: #DFF3F1; stroke: #1F8A82; }
.purple { fill: #EDE7F6; stroke: #6A4FA0; }
.blue { fill: #E3EEFB; stroke: #2F6FB0; }
.gray { fill: #EDEFF2; stroke: #8B93A1; }
.coral { fill: #FBD9CD; stroke: #E8623F; }
.amber { fill: #F5B942; stroke: #A9791B; }
.dash { fill: none; stroke: #1F8A82; stroke-width: 0.7; stroke-dasharray: 2,2; }
</style>

<text class="th" x="190" y="26" text-anchor="middle">Handle area (unchanged)</text>

<rect x="165" y="40" width="50" height="55" rx="20" class="coral" stroke-width="0.5"/>
<text class="ts" x="228" y="60" text-anchor="start" dominant-baseline="central">Rubber grip</text>
<line x1="226" y1="60" x2="217" y2="60" stroke="#5A5F6B" marker-end="url(#arrow)"/>
<text class="ts" x="228" y="76" text-anchor="start" dominant-baseline="central">left untouched</text>

<rect x="175" y="95" width="30" height="30" class="gray" stroke-width="0.5"/>
<ellipse cx="190" cy="95" rx="15" ry="5" class="gray" stroke-width="0.5"/>
<text class="ts" x="228" y="112" text-anchor="start" dominant-baseline="central">Rigid shaft</text>
<line x1="226" y1="112" x2="207" y2="112" stroke="#5A5F6B" marker-end="url(#arrow)"/>
<text class="ts" x="228" y="128" text-anchor="start" dominant-baseline="central">begins here</text>

<text class="th" x="190" y="160" text-anchor="middle">1. Permanent base (below grip)</text>

<rect x="150" y="175" width="80" height="70" class="teal" stroke-width="0.5"/>
<ellipse cx="190" cy="175" rx="40" ry="10" class="teal" stroke-width="0.5"/>
<ellipse cx="190" cy="245" rx="40" ry="10" class="teal" stroke-width="0.5"/>
<ellipse cx="190" cy="180" rx="26" ry="6" class="dash"/>
<text class="ts" x="235" y="185" text-anchor="start" dominant-baseline="central">Threaded rim</text>
<line x1="233" y1="185" x2="217" y2="183" stroke="#5A5F6B" marker-end="url(#arrow)"/>

<circle cx="170" cy="210" r="3" class="amber"/>
<circle cx="190" cy="210" r="3" class="amber"/>
<circle cx="210" cy="210" r="3" class="amber"/>
<text class="ts" x="245" y="210" text-anchor="start" dominant-baseline="central">Contact pins</text>
<line x1="243" y1="210" x2="215" y2="210" stroke="#5A5F6B" marker-end="url(#arrow)"/>

<text class="ts" x="190" y="275" text-anchor="middle">Mounted on rigid shaft, wired to sensors</text>

<line x1="190" y1="295" x2="190" y2="325" stroke="#5A5F6B" marker-end="url(#arrow)"/>
<text class="ts" x="205" y="310" text-anchor="start">twist to attach</text>

<text class="th" x="190" y="355" text-anchor="middle">2. Removable pod (electronics)</text>

<rect x="145" y="375" width="90" height="140" class="purple" stroke-width="0.5"/>
<ellipse cx="190" cy="375" rx="45" ry="11" class="purple" stroke-width="0.5"/>
<ellipse cx="190" cy="515" rx="45" ry="11" class="purple" stroke-width="0.5"/>
<ellipse cx="190" cy="381" rx="30" ry="6" class="dash" stroke="#6A4FA0"/>
<text class="th" x="190" y="440" text-anchor="middle" dominant-baseline="central" font-size="14">Arduino</text>
<text class="ts" x="190" y="456" text-anchor="middle" dominant-baseline="central">+ battery</text>

<circle cx="190" cy="500" r="7" class="coral"/>
<text class="ts" x="245" y="500" text-anchor="start" dominant-baseline="central">SOS button</text>
<line x1="243" y1="500" x2="199" y2="500" stroke="#5A5F6B" marker-end="url(#arrow)"/>

<circle cx="170" cy="410" r="3" class="amber"/>
<circle cx="190" cy="410" r="3" class="amber"/>
<circle cx="210" cy="410" r="3" class="amber"/>
<text class="ts" x="245" y="410" text-anchor="start" dominant-baseline="central">Matching pads</text>
<line x1="243" y1="410" x2="215" y2="410" stroke="#5A5F6B" marker-end="url(#arrow)"/>

<text class="ts" x="190" y="545" text-anchor="middle">Same diameter as the rod</text>

<line x1="190" y1="565" x2="190" y2="595" stroke="#5A5F6B" marker-end="url(#arrow)"/>
<text class="ts" x="205" y="580" text-anchor="start">when detached</text>

<text class="th" x="190" y="625" text-anchor="middle">3. Charging dock</text>

<rect x="150" y="645" width="80" height="65" class="blue" stroke-width="0.5"/>
<ellipse cx="190" cy="645" rx="40" ry="10" class="blue" stroke-width="0.5"/>
<ellipse cx="190" cy="710" rx="40" ry="10" class="blue" stroke-width="0.5"/>
<ellipse cx="190" cy="650" rx="26" ry="6" class="dash" stroke="#2F6FB0"/>
<circle cx="170" cy="677" r="3" class="amber"/>
<circle cx="190" cy="677" r="3" class="amber"/>
<circle cx="210" cy="677" r="3" class="amber"/>
<text class="ts" x="245" y="677" text-anchor="start" dominant-baseline="central">Same contacts</text>
<line x1="243" y1="677" x2="215" y2="677" stroke="#5A5F6B" marker-end="url(#arrow)"/>

<rect x="175" y="720" width="30" height="40" rx="3" class="gray" stroke-width="0.5"/>
<text class="ts" x="245" y="740" text-anchor="start" dominant-baseline="central">USB power base</text>
<line x1="243" y1="740" x2="207" y2="740" stroke="#5A5F6B" marker-end="url(#arrow)"/>

<text class="ts" x="190" y="790" text-anchor="middle">Stand with matching thread pattern</text>

<text class="ts" x="190" y="815" text-anchor="middle">One pod fits both the cane base</text>
<text class="ts" x="190" y="831" text-anchor="middle">and the charging dock</text>

</svg>
