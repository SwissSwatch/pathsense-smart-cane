<svg width="760" height="1400" viewBox="0 0 380 700" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>PathSense cane diagram with a fixed base collar and a removable sleeve that slides in from the top</title>
<desc>An illustrative diagram of a white cane showing the rubber grip preserved at the top, a removable semi-hollow cylindrical sleeve just below it that slides down from above the shaft to house the Arduino and battery, a fixed permanent base collar beneath the sleeve that it locks into, dual ultrasonic sensors further down the shaft for left and right obstacle detection, and a downward angled ground-depth sensor at the tip.</desc>

<rect x="0" y="0" width="380" height="700" fill="#FFFFFF"/>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5A5F6B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="182" y="40" width="16" height="55" rx="10" fill="#EDEFF2" stroke="#8B93A1" stroke-width="0.5"/>
<rect x="182" y="98" width="16" height="500" fill="#F4F6F8" stroke="#8B93A1" stroke-width="0.5"/>
<ellipse cx="190" cy="600" rx="16" ry="10" fill="#EDEFF2" stroke="#8B93A1" stroke-width="0.5"/>

<line x1="190" y1="100" x2="190" y2="122" stroke="#6A4FA0" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="164" y="128" width="52" height="90" rx="10" fill="#EEEDFE" stroke="#6A4FA0" stroke-width="0.5"/>
<rect x="178" y="128" width="24" height="14" rx="2" fill="#EEEDFE" stroke="#6A4FA0" stroke-width="0.5"/>
<line x1="176" y1="150" x2="176" y2="200" stroke="#6A4FA0" stroke-width="0.5" stroke-dasharray="2,2"/>
<line x1="204" y1="150" x2="204" y2="200" stroke="#6A4FA0" stroke-width="0.5" stroke-dasharray="2,2"/>

<rect x="176" y="222" width="28" height="24" rx="3" fill="#E1F5EE" stroke="#1F8A82" stroke-width="0.5"/>

<circle cx="192" cy="330" r="8" fill="#FAEEDA" stroke="#A9791B" stroke-width="0.5"/>
<circle cx="188" cy="380" r="8" fill="#FAEEDA" stroke="#A9791B" stroke-width="0.5"/>

<circle cx="190" cy="590" r="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>

<text x="230" y="52" font-size="14" font-weight="bold" fill="#1B2A4A" text-anchor="start" dominant-baseline="central">Rubber grip</text>
<text x="230" y="69" font-size="12" fill="#5A5F6B" text-anchor="start" dominant-baseline="central">left untouched</text>
<line x1="228" y1="60" x2="200" y2="60" stroke="#5A5F6B" marker-end="url(#arrow)"/>

<text x="240" y="150" font-size="14" font-weight="bold" fill="#1B2A4A" text-anchor="start" dominant-baseline="central">Removable sleeve</text>
<text x="240" y="167" font-size="12" fill="#5A5F6B" text-anchor="start" dominant-baseline="central">Slides in from top</text>
<text x="240" y="182" font-size="12" fill="#5A5F6B" text-anchor="start" dominant-baseline="central">Houses Arduino, battery</text>
<line x1="238" y1="162" x2="220" y2="162" stroke="#5A5F6B" marker-end="url(#arrow)"/>

<text x="230" y="234" font-size="14" font-weight="bold" fill="#1B2A4A" text-anchor="start" dominant-baseline="central">Fixed base collar</text>
<text x="230" y="251" font-size="12" fill="#5A5F6B" text-anchor="start" dominant-baseline="central">Permanent, sleeve locks in</text>
<line x1="228" y1="234" x2="207" y2="234" stroke="#5A5F6B" marker-end="url(#arrow)"/>

<text x="240" y="325" font-size="14" font-weight="bold" fill="#1B2A4A" text-anchor="start" dominant-baseline="central">Left sensor</text>
<text x="240" y="342" font-size="12" fill="#5A5F6B" text-anchor="start" dominant-baseline="central">Ultrasonic, side obstacle</text>
<line x1="238" y1="330" x2="202" y2="330" stroke="#5A5F6B" marker-end="url(#arrow)"/>

<text x="240" y="380" font-size="14" font-weight="bold" fill="#1B2A4A" text-anchor="start" dominant-baseline="central">Right sensor</text>
<text x="240" y="397" font-size="12" fill="#5A5F6B" text-anchor="start" dominant-baseline="central">Ultrasonic, side obstacle</text>
<line x1="238" y1="380" x2="198" y2="380" stroke="#5A5F6B" marker-end="url(#arrow)"/>

<text x="240" y="600" font-size="14" font-weight="bold" fill="#1B2A4A" text-anchor="start" dominant-baseline="central">Depth sensor</text>
<text x="240" y="617" font-size="12" fill="#5A5F6B" text-anchor="start" dominant-baseline="central">Angled down, tip</text>
<line x1="238" y1="605" x2="200" y2="596" stroke="#5A5F6B" marker-end="url(#arrow)"/>

<text x="190" y="655" font-size="12" fill="#5A5F6B" text-anchor="middle">Sleeve lifts off the top for charging or swap</text>

</svg>
